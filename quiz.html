<style>
:root{--w80:rgba(255,255,255,.84);--w60:rgba(255,255,255,.64);--sky:#0B43B5;--orange:#FF8A2A}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;background:var(--sky);overscroll-behavior-y:none}
body{color:#fff;font:400 16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit}

/* ---------- stage (same photo background as before) ---------- */
.stage{position:relative;min-height:100vh;min-height:100svh;overflow:hidden;overflow:clip}
.bg{position:absolute;inset:0;z-index:0;overflow:hidden;background:linear-gradient(#0D4FC4,#1E78E6 60%,#3FA3F0)}
.bg img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 100%;display:block;opacity:0;transition:opacity .8s ease}
.bg img.ready{opacity:1}
.shade{position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(to top,rgba(2,24,58,.42) 0%,rgba(2,24,58,0) 14%)}
.page{position:relative;z-index:2;min-height:100vh;min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:0 24px}

/* ---------- glass v2 (same look as the live site) ---------- */
.glass{position:relative;isolation:isolate;
  background:radial-gradient(130% 90% at 15% -10%,rgba(255,255,255,.26) 0%,rgba(255,255,255,0) 55%),linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.07) 60%,rgba(255,255,255,.11) 100%);
  -webkit-backdrop-filter:blur(26px) saturate(1.2) brightness(1.03);backdrop-filter:blur(26px) saturate(1.2) brightness(1.03);
  box-shadow:inset 0 1.5px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.22),inset 0 0 0 1px rgba(255,255,255,.14),inset 0 0 22px 2px rgba(255,255,255,.14),inset 0 10px 24px -14px rgba(255,255,255,.45),0 1px 2px rgba(3,20,60,.10),0 26px 56px -24px rgba(3,20,60,.55)}
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;padding:1.25px;
  background:conic-gradient(from 200deg at 50% 50%,rgba(255,255,255,.95) 0deg,rgba(186,222,255,.55) 30deg,rgba(255,206,236,.40) 55deg,rgba(255,255,255,.12) 95deg,rgba(255,255,255,.06) 160deg,rgba(206,255,236,.30) 215deg,rgba(255,232,196,.38) 250deg,rgba(255,255,255,.75) 310deg,rgba(255,255,255,.95) 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}
.glass.sm{-webkit-backdrop-filter:blur(14px) saturate(1.2) brightness(1.04);backdrop-filter:blur(14px) saturate(1.2) brightness(1.04);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.75),inset 0 -1px 0 rgba(255,255,255,.2),inset 0 0 0 1px rgba(255,255,255,.14),inset 0 0 12px 1px rgba(255,255,255,.14),0 1px 2px rgba(3,20,60,.10),0 10px 24px -12px rgba(3,20,60,.5)}
.glass.sm::before{padding:1px}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(20,70,160,.78)}}

/* ---------- nav ---------- */
nav{width:100%;max-width:1120px;height:44px;margin-top:22px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;text-decoration:none;height:44px}
.brand .word{height:46px;width:80px;display:block;margin-top:8px;filter:drop-shadow(0 2px 10px rgba(3,20,60,.25))}
.x{flex:none;width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;text-decoration:none;transition:transform .2s}
.x:hover{transform:translateY(-1px)}
.x svg{width:16px;height:16px;fill:currentColor;display:block}

/* ---------- hero ---------- */
.hero{flex:1;width:100%;max-width:1120px;display:flex;flex-direction:column;align-items:center;justify-content:safe center;text-align:center;padding:20px 0 calc(max(20svh,12vw) + 20px)}
.copy{display:flex;flex-direction:column;align-items:center}
.pill{display:inline-flex;align-items:center;gap:9px;padding:9px 16px 9px 14px;border-radius:999px;font-size:11.5px;line-height:1.2;font-weight:600;letter-spacing:.17em;text-transform:uppercase}
.led{flex:none;width:7px;height:7px;border-radius:50%;background:var(--orange);box-shadow:0 0 0 3px rgba(255,154,61,.3);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(255,154,61,.06)}}
h1{margin-top:20px;font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:clamp(46px,5.6vw,80px);line-height:.98;letter-spacing:-.022em;text-shadow:0 4px 30px rgba(3,24,70,.28)}
h1 em{font-style:italic;padding-right:.06em;background:linear-gradient(95deg,#FFC37A 0%,#FF8A2A 55%,#FF6A00 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.lede{margin-top:16px;max-width:560px;font-size:clamp(16px,1.35vw,18px);line-height:1.6;color:var(--w80);text-shadow:0 1px 12px rgba(3,24,70,.3)}
.lede b{color:#FFC98F;font-weight:700}

/* ---------- buttons ---------- */
.cta{height:56px;padding:0 30px;border-radius:28px;border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:linear-gradient(160deg,#FFB064 0%,#FF8A2A 45%,#FF6A00 100%);color:#fff;font-size:16.5px;font-weight:600;letter-spacing:-.01em;text-shadow:0 1px 2px rgba(120,40,0,.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 0 -2px 6px rgba(160,50,0,.25),0 10px 24px -8px rgba(255,106,0,.65);-webkit-appearance:none;appearance:none;outline:none;transition:transform .18s,filter .18s,opacity .18s}
.cta:hover{transform:translateY(-1px);filter:brightness(1.05)}
.cta:active{transform:translateY(1px)}
.cta:focus-visible{box-shadow:inset 0 0 0 2px #fff,0 10px 24px -8px rgba(255,106,0,.65)}
.cta:disabled{opacity:.45;cursor:default;transform:none;filter:none}
.start{margin-top:26px}
.hint{margin-top:12px;font-size:13px;color:var(--w80);text-shadow:0 1px 10px rgba(3,24,70,.35)}

/* ---------- quiz card ---------- */
.card{width:100%;max-width:500px;margin:0 auto;padding:22px 24px 24px;border-radius:32px;text-align:left}
.top{display:flex;align-items:center;gap:12px}
.back{flex:none;width:36px;height:36px;border-radius:50%;border:0;cursor:pointer;display:grid;place-items:center;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);transition:background .2s,opacity .2s}
.back:hover{background:rgba(255,255,255,.2)}
.back[hidden]{display:grid;visibility:hidden}
.back svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.bar{flex:1;height:8px;border-radius:4px;background:rgba(6,27,63,.28);box-shadow:inset 0 1px 2px rgba(3,20,60,.3);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,#FFB064,#FF6A00);transition:width .45s cubic-bezier(.2,.8,.2,1)}
.step{flex:none;min-width:44px;text-align:right;font-size:13px;font-weight:600;color:var(--w80);font-variant-numeric:tabular-nums}
.screen{margin-top:20px}
.screen.in{animation:slide .38s cubic-bezier(.2,.8,.25,1) both}
.screen.in.rev{animation-name:slideback}
@keyframes slide{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes slideback{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
.q{font-family:'Instrument Serif',Georgia,serif;font-weight:400;font-size:31px;line-height:1.1;letter-spacing:-.012em}
.q.long{font-family:Inter,system-ui,sans-serif;font-size:17px;line-height:1.5;font-weight:500;color:var(--w80)}
.q.long b{display:block;margin-top:10px;font-family:'Instrument Serif',Georgia,serif;font-size:30px;line-height:1.1;font-weight:400;color:#fff}
.sub{margin-top:6px;font-size:13.5px;color:var(--w60)}
.opts{margin-top:18px;display:grid;gap:9px}
.opt{width:100%;min-height:52px;padding:12px 18px;border-radius:18px;border:0;cursor:pointer;text-align:left;font-size:15.5px;font-weight:500;line-height:1.35;display:flex;align-items:center;gap:12px;
  background:rgba(255,255,255,.10);box-shadow:inset 0 0 0 1px rgba(255,255,255,.24),inset 0 1px 0 rgba(255,255,255,.22);transition:background .18s,box-shadow .18s,transform .12s}
.opt:hover{background:rgba(255,255,255,.18)}
.opt:active{transform:scale(.985)}
.opt:focus-visible{outline:none;box-shadow:inset 0 0 0 2px rgba(255,178,110,.95)}
.opt.on{background:linear-gradient(135deg,rgba(255,176,100,.42),rgba(255,106,0,.30));box-shadow:inset 0 0 0 1.5px rgba(255,190,130,.95),0 6px 18px -8px rgba(255,106,0,.6)}
.opt .tick{flex:none;margin-left:auto;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.5);font-size:13px;font-weight:700}
.opt.on .tick{background:#fff;color:#FF6A00;box-shadow:none}
.opts.grid2{grid-template-columns:1fr 1fr}
.next{margin-top:16px;width:100%}

/* halfway + final screens */
.center{text-align:center;padding:26px 0 14px}
.big{font-size:54px;line-height:1}
.center .q{margin-top:14px}
.center .sub{font-size:15px;color:var(--w80)}
.form{margin-top:20px;display:flex;flex-direction:column;gap:10px}
.form input{width:100%;height:56px;padding:0 20px;border-radius:28px;border:0;outline:none;background:rgba(6,27,63,.30);color:#fff;font:inherit;font-size:16px;
  box-shadow:inset 0 2px 6px rgba(3,20,60,.35),inset 0 0 0 1px rgba(255,255,255,.24);-webkit-appearance:none;appearance:none;transition:box-shadow .2s,background .2s}
.form input::placeholder{color:rgba(255,255,255,.62)}
.form input:focus{background:rgba(6,27,63,.38);box-shadow:inset 0 2px 6px rgba(3,20,60,.35),inset 0 0 0 2px rgba(255,178,110,.95)}
.form .cta{width:100%}
.fine{margin-top:12px;font-size:12.5px;color:var(--w60);text-align:center}
.fine a{color:inherit}
.msg{margin-top:12px;font-size:14px;font-weight:600;text-align:center;min-height:0}
.msg:empty{display:none}
.msg.err{color:#FFD2C4}
.ghost{margin-top:12px;width:100%;height:50px;border-radius:25px;border:0;cursor:pointer;font-size:15px;font-weight:600;background:rgba(255,255,255,.12);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3);transition:background .2s}
.ghost:hover{background:rgba(255,255,255,.2)}

/* ---------- stores + footer links ---------- */
.meta{margin-top:24px;display:flex;flex-direction:column;align-items:center;gap:12px}
.stores{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px 16px;font-size:14px;line-height:1;font-weight:600;text-shadow:0 1px 10px rgba(3,24,70,.35)}
.stores .lbl{font-weight:500;color:var(--w80);letter-spacing:.02em}
.store{display:inline-flex;align-items:center;gap:7px}
.store svg{flex:none;width:17px;height:17px;fill:#fff;display:block}
.legal{font-size:12.5px;color:var(--w80);text-shadow:0 1px 8px rgba(2,24,58,.5)}
.legal a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.35)}

/* ---------- one screen, never scrolls (landing AND quiz) ---------- */
html,body{height:100%;overflow:hidden}
.stage,.page{height:100vh;height:100svh;min-height:0}
.hero{min-height:0}
body.quiz .hero{justify-content:center;padding-bottom:max(14px,env(safe-area-inset-bottom))}
body.quiz .card{max-height:100%;display:flex;flex-direction:column}
body.quiz .screen{min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}
body.quiz .screen::-webkit-scrollbar{display:none}

/* ---------- visitor counter pill ---------- */
.counter{display:none;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:18px;font-size:13.5px;line-height:1;white-space:nowrap}
.counter.show{display:inline-flex;animation:up .5s ease both}
.counter b{font-weight:700;font-variant-numeric:tabular-nums;color:var(--orange)}
.counter .dot{width:7px;height:7px;border-radius:50%;background:#3BE38B;box-shadow:0 0 0 3px rgba(59,227,139,.25);animation:pulse2 2.4s ease-in-out infinite}
@keyframes pulse2{50%{box-shadow:0 0 0 6px rgba(59,227,139,.05)}}
body.quiz .counter{display:none!important}

/* ---------- confetti ---------- */
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.half .big{font-size:64px;display:inline-block;animation:fly 1.4s cubic-bezier(.2,.8,.2,1) both}
@keyframes fly{0%{transform:translate(-70px,40px) rotate(-20deg) scale(.6);opacity:0}60%{opacity:1}100%{transform:none;opacity:1}}
.half .q{font-size:38px}
.half .sub b{color:#FFC98F}
.ring{margin:18px auto 0;width:min(260px,80%);height:10px;border-radius:5px;background:rgba(6,27,63,.28);overflow:hidden}
.ring i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#FFB064,#FF6A00);animation:fill 1.1s .25s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes fill{to{width:50%}}
.type{margin-top:6px;font-family:'Instrument Serif',Georgia,serif;font-size:40px;line-height:1.05;background:linear-gradient(95deg,#FFC37A 0%,#FF8A2A 55%,#FF6A00 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.kicker{font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--w80)}

/* ---------- modes ---------- */
body.quiz .copy,body.quiz .start,body.quiz .hint{display:none}
body:not(.quiz) #card{display:none}

.up{animation:up .9s cubic-bezier(.2,.7,.25,1) both}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.d1{animation-delay:.05s}.d2{animation-delay:.12s}.d3{animation-delay:.2s}.d4{animation-delay:.28s}.d5{animation-delay:.36s}.d6{animation-delay:.46s}

@media (max-width:600px){
  .page{padding:0 16px}
  nav{margin-top:10px;height:40px}
  .brand{height:40px}
  .brand .word{height:36px;width:62px;margin-top:6px}
  .x{width:40px;height:40px}
  .hero{padding-top:18px;padding-bottom:max(18px,env(safe-area-inset-bottom))}
  body:not(.quiz) .hero{padding-bottom:calc(14svh + 6px)}
  .pill{padding:7px 13px 7px 11px;font-size:10.5px;letter-spacing:.15em}
  h1{margin-top:14px;font-size:clamp(40px,11.5vw,50px);line-height:1}
  .lede{margin-top:12px;font-size:15px;max-width:340px}
  .start{margin-top:22px;width:100%;max-width:340px}
  .card{padding:16px 16px 18px;border-radius:26px}
  .screen{margin-top:16px}
  .q{font-size:27px}
  .q.long{font-size:15px}
  .q.long b{font-size:25px}
  .opts{margin-top:14px;gap:8px}
  .opt{min-height:48px;padding:10px 15px;font-size:15px;border-radius:16px}
  .meta{margin-top:18px}
  .stores{font-size:13px;gap:8px 14px}
  .store svg{width:15px;height:15px}
}
@media (max-width:380px){.opts.grid2{grid-template-columns:1fr}}
@media (max-height:760px) and (max-width:600px){body.quiz .stores{display:none}body.quiz .meta{margin-top:10px}}
@media (max-height:720px){
  nav{margin-top:8px}
  .card{padding:14px 14px 14px}
  .screen{margin-top:12px}
  .q{font-size:24px}
  .q.long{font-size:14px;line-height:1.45}
  .q.long b{font-size:22px;margin-top:6px}
  .opts{margin-top:12px;gap:7px}
  .opt{min-height:44px;padding:9px 14px;font-size:14.5px}
  .next{margin-top:12px}
  .cta{height:50px}
  .meta{margin-top:12px;gap:8px}
  .center{padding:14px 0 8px}
  .big{font-size:44px}
  .form{margin-top:14px}
  .form input{height:50px}
  h1{font-size:clamp(36px,10.5vw,46px)}
  .start{margin-top:18px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>
/* ============================================================
   Guidr survey. Backend: Supabase project "wishlist website-guidr".
   The page calls join_waitlist(p_email, p_source, p_referrer, p_lang, p_tz, p_answers)
   and record_visit(p_visitor, p_source, p_started) for the visitor counter.
   Answers are kept in the browser (localStorage) while people go through the quiz,
   and saved together with the email on the last screen.
   To change a question: edit QUESTIONS below. Keep the "id" values stable once live,
   they are the keys in the answers column.
   ============================================================ */
var SUPA = 'https://ohrgavamspzzkzbopxrm.supabase.co';
var KEY  = 'sb_publishable_jfESc0pJkst9R_UoWXhjLA_7i1lrLUd';
var STORE = 'guidr_quiz_v1';
var HALFWAY_AFTER = 'style';

var QUESTIONS = [
  { id:'vibe', q:'Dream trip vibe?', opts:[
    ['beach','🏝️ Beach and chill'],['city','🌆 City hopping'],['food','🍜 Food trip'],['adventure','🧗 Adventure'],['gems','🗺️ Hidden gems'] ]},
  { id:'with', q:'Who do you travel with most?', grid:true, opts:[
    ['solo','🎒 Solo'],['partner','💑 Partner'],['friends','👯 Friends'],['family','👨‍👩‍👧 Family'] ]},
  { id:'age', q:'How old are you?', grid:true, opts:[
    ['u16','Under 16'],['16-18','16 to 18'],['19-24','19 to 24'],['25-34','25 to 34'],['35+','35+'] ]},
  { id:'discover', q:'Where do you find places to go?', sub:'Pick all that apply', multi:true, grid:true, opts:[
    ['tiktok','TikTok'],['instagram','Instagram'],['maps','Google Maps'],['reddit','Reddit'],['chatgpt','ChatGPT'],['youtube','YouTube'],['friends','Friends'],['blogs','Blogs'] ]},
  { id:'saved', q:'How many travel videos have you saved and never visited?', opts:[
    ['0','0'],['1-19','1 to 19'],['20-99','20 to 99'],['100+','100+'],['lost','Lost count 💀'] ]},
  { id:'style', q:'Your planning style?', opts:[
    ['screenshots','📸 Screenshot hoarder'],['groupchat','💬 Group chat chaos'],['spreadsheet','📊 Spreadsheet boss'],['wing','🎲 I wing it'] ]},
  { id:'pain', q:'Worst part of planning?', sub:'Pick up to 2', multi:true, max:2, opts:[
    ['saves_to_plan','Turning saves into a real plan'],['friends_agree','Getting friends to agree'],['my_vibe','Finding places that are actually my vibe'],['logistics','Timing, distances, opening hours'],['budget','Budget'] ]},
  { id:'time', q:'How long does planning one trip take you?', opts:[
    ['u2h','Under 2 hours'],['2-5h','2 to 5 hours'],['5-10h','5 to 10 hours'],['10-20h','10 to 20 hours'],['20h+','20+ hours'] ]},
  { id:'apps', q:'How many apps or tabs do you use to plan one trip?', grid:true, opts:[
    ['1-3','1 to 3'],['4-6','4 to 6'],['7-10','7 to 10'],['tons','Too many to count'] ]},
  { id:'ai', q:'Ever used ChatGPT or AI to plan a trip?', opts:[
    ['great','Yes, it was great'],['off','Yes, but the plan was off'],['would','No, but I would'],['never','No, never'] ]},
  { id:'pay', long:true, lead:'Imagine an app that turns everything you’ve saved into a full trip made for your taste, with routes, timings and your friends planning with you.', q:'How would you pay for it?', opts:[
    ['free','Only if it’s free'],['weekly','Weekly'],['monthly','Monthly'],['yearly','Yearly'],['trip','Per trip'] ]},
  { id:'price', follow:true, grid:true, q:function(a){ return 'How much would you pay per '+({weekly:'week',monthly:'month',yearly:'year',trip:'trip'}[a.pay]||'month')+'?'; },
    opts:function(a){ return a.pay==='weekly' ?[['2','$2'],['3','$3'],['5','$5'],['7+','$7+']]
                          :a.pay==='monthly'?[['5','$5'],['8','$8'],['10','$10'],['15+','$15+']]
                          :a.pay==='yearly' ?[['29','$29'],['49','$49'],['69','$69'],['99+','$99+']]
                          :[['3','$3'],['5','$5'],['8','$8'],['12+','$12+']]; } },
  { id:'beta', q:'Want to test Guidr early, before it launches?', opts:[
    ['yes','🙋 Yes, I’d test it'],['maybe','🤔 Maybe'],['no','No thanks'] ]}
];
var MAIN_COUNT = QUESTIONS.filter(function(q){return !q.follow;}).length;

var $ = function(id){ return document.getElementById(id); };
var reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
var state = load() || { a:{}, i:0, t0:0, done:false };

function load(){ try{ var s=JSON.parse(localStorage.getItem(STORE)); return s && s.a ? s : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }

/* The list of screens depends on the answers (price only shows if they'd pay). */
function flow(){
  var f=[];
  QUESTIONS.forEach(function(q){
    if (q.id==='price' && (!state.a.pay || state.a.pay==='free')) return;
    f.push(q.id);
    if (q.id===HALFWAY_AFTER) f.push('half');
  });
  f.push('email');
  return f;
}
function qById(id){ for(var k=0;k<QUESTIONS.length;k++) if(QUESTIONS[k].id===id) return QUESTIONS[k]; }
function val(x){ return typeof x==='function' ? x(state.a) : x; }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

function progress(id){
  var f=flow(), idx=f.indexOf(id), main=0;
  for (var k=0;k<idx;k++){ var q=qById(f[k]); if(q && !q.follow) main++; }
  var cur = qById(id);
  var n = cur && cur.follow ? main : main+1;
  $('stepTxt').textContent = cur ? n+' / '+MAIN_COUNT : '';
  $('barFill').style.width = (id==='email' ? 100 : Math.round((main / MAIN_COUNT)*100)) + '%';
}

function render(dir){
  var f=flow();
  if (state.i>=f.length) state.i=f.length-1;
  if (state.i<0) state.i=0;
  var id=f[state.i], el=$('screen');
  $('backBtn').hidden = state.i===0;
  progress(id);
  el.className='screen';
  if (id==='half') el.innerHTML = halfHTML();
  else if (id==='email') el.innerHTML = emailHTML();
  else el.innerHTML = questionHTML(qById(id));
  void el.offsetWidth;
  el.className='screen in'+(dir<0?' rev':'');
  wire(id);
  save();
}

function questionHTML(q){
  var opts=val(q.opts), sel=state.a[q.id], multi=!!q.multi;
  var h = q.long
    ? '<h2 class="q long">'+esc(q.lead)+'<b>'+esc(val(q.q))+'</b></h2>'
    : '<h2 class="q">'+esc(val(q.q))+'</h2>';
  if (q.sub) h += '<p class="sub">'+esc(q.sub)+'</p>';
  h += '<div class="opts'+(q.grid?' grid2':'')+'" role="'+(multi?'group':'radiogroup')+'">';
  opts.forEach(function(o){
    var on = multi ? (Array.isArray(sel)&&sel.indexOf(o[0])>-1) : sel===o[0];
    h += '<button type="button" class="opt'+(on?' on':'')+'" data-v="'+esc(o[0])+'" aria-pressed="'+on+'">'+esc(o[1])+(multi?'<span class="tick">'+(on?'✓':'')+'</span>':'')+'</button>';
  });
  h += '</div>';
  if (multi) h += '<button type="button" class="cta next" id="nextBtn"'+((Array.isArray(sel)&&sel.length)?'':' disabled')+'>Next →</button>';
  return h;
}
function halfHTML(){
  var left = MAIN_COUNT - 6;
  return '<div class="center half"><div class="big">✈️</div><h2 class="q">Halfway there!</h2><div class="ring"><i></i></div><p class="sub" style="margin-top:14px">'+left+' more taps and your <b>free month</b> is locked in.</p></div>';
}
function emailHTML(){
  return '<div class="center" style="padding-bottom:0"><div class="big">🎉</div><h2 class="q">Your travel type is ready</h2>'+
    '<p class="sub">Drop your email to see it and get <b style="color:#FFC98F">1 month free</b> when Guidr launches.</p></div>'+
    '<form class="form" id="form" novalidate>'+
      '<input type="email" id="email" placeholder="you@email.com" autocomplete="email" inputmode="email" aria-label="Email address" required>'+
      '<button type="submit" class="cta" id="sendBtn">Show my type + free month</button>'+
    '</form>'+
    '<p class="msg" id="msg" role="status"></p>'+
    '<p class="fine">Your code is sent the day the app drops. No spam. <a href="privacy.html">Privacy</a></p>';
}
var TYPES = {
  screenshots:['📸','The Dreamer','Your camera roll is a bucket list. Guidr turns those saves into real trips.'],
  groupchat:['💬','The Squad Captain','You get everyone hyped. Guidr gets everyone to actually agree.'],
  spreadsheet:['📊','The Mastermind','Color-coded and ready. Guidr does the spreadsheet for you.'],
  wing:['🎲','The Free Spirit','No plan, all vibes. Guidr finds the good spots on the fly.']
};
var VIBE = { beach:'Beach', city:'City', food:'Foodie', adventure:'Adventure', gems:'Hidden-gem' };
function doneHTML(already){
  var t = TYPES[state.a.style] || TYPES.wing, v = VIBE[state.a.vibe];
  return '<div class="center"><div class="big">'+t[0]+'</div><p class="kicker" style="margin-top:12px">'+(v?esc(v)+' traveler':'Your travel type')+'</p>'+
    '<div class="type">'+esc(t[1])+'</div>'+
    '<p class="sub" style="margin-top:8px">'+esc(t[2])+'</p>'+
    '<p class="sub" style="margin-top:12px">✅ '+(already?'You were already in. ':'You’re in. ')+'Your free month code arrives the day Guidr drops.</p></div>'+
    '<button type="button" class="cta next" id="shareBtn">Send it to a friend</button>'+
    '<p class="msg" id="msg" role="status"></p>';
}

var halfTimer=null;
function wire(id){
  clearTimeout(halfTimer);
  if (id==='half'){ confetti(90); halfTimer=setTimeout(function(){ go(1); }, 2200); return; }
  if (id==='email'){
    var input=$('email');
    if (state.email) input.value=state.email;
    $('form').addEventListener('submit', submit);
    if (!('ontouchstart' in window)) setTimeout(function(){ input.focus(); }, 60);
    return;
  }
  var q=qById(id);
  Array.prototype.forEach.call(document.querySelectorAll('#screen .opt'), function(b){
    b.addEventListener('click', function(){ pick(q, b.getAttribute('data-v'), b); });
  });
  var nb=$('nextBtn'); if (nb) nb.addEventListener('click', function(){ go(1); });
}

var busy=false;
function pick(q, v, btn){
  if (busy) return;
  if (!state.t0) state.t0 = Date.now();
  if (q.multi){
    var arr = Array.isArray(state.a[q.id]) ? state.a[q.id].slice() : [];
    var at = arr.indexOf(v);
    if (at>-1) arr.splice(at,1);
    else { if (q.max && arr.length>=q.max) arr.shift(); arr.push(v); }
    state.a[q.id]=arr; save();
    Array.prototype.forEach.call(document.querySelectorAll('#screen .opt'), function(b){
      var on = arr.indexOf(b.getAttribute('data-v'))>-1;
      b.classList.toggle('on',on); b.setAttribute('aria-pressed',on);
      b.querySelector('.tick').textContent = on?'✓':'';
    });
    $('nextBtn').disabled = !arr.length;
    return;
  }
  if (q.id==='pay' && state.a.pay!==v) delete state.a.price;
  state.a[q.id]=v; save();
  Array.prototype.forEach.call(document.querySelectorAll('#screen .opt'), function(b){
    var on=b===btn; b.classList.toggle('on',on); b.setAttribute('aria-pressed',on);
  });
  busy=true;
  setTimeout(function(){ busy=false; go(1); }, reduced?60:220);
}
function go(d){ state.i+=d; render(d); }

$('backBtn').addEventListener('click', function(){
  var f=flow();
  if (state.done) return;
  if (state.i<=0) return;
  state.i--;
  if (f[state.i]==='half') state.i--;   // skip the auto-advancing halfway screen when going back
  render(-1);
});

function say(kind, text){ var m=$('msg'); if(!m) return; m.className='msg'+(kind?' '+kind:''); m.textContent=text; }

var EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/;
function submit(e){
  e.preventDefault();
  var input=$('email'), btn=$('sendBtn');
  var email=input.value.trim().toLowerCase();
  state.email=email; save();
  if (!EMAIL_RE.test(email)){ say('err','Enter a valid email address.'); input.focus(); return; }
  btn.disabled=true; btn.textContent='Saving…'; say('','');
  send(email).then(function(res){
    if (res && res.ok){
      state.done=true; state.already = res.status==='already'; save();
      showDone(true);
    } else {
      btn.disabled=false; btn.textContent='Show my type + free month';
      var e2 = res && res.error;
      if (e2==='invalid_email') say('err','That email looks off. Double-check it?');
      else if (e2==='disposable') say('err','Please use a real inbox, not a throwaway one.');
      else if (e2==='rate_limited') say('err','Too many tries from here. Give it a few minutes.');
      else say('err','Couldn’t save that. Check your connection and tap again, your answers are kept.');
    }
  });
}

function send(email){
  var params=new URLSearchParams(location.search);
  var src=(params.get('src')||params.get('utm_source')||'direct').toLowerCase();
  var ref=''; try{ ref=document.referrer?new URL(document.referrer).hostname:''; }catch(e){}
  var tz=''; try{ tz=Intl.DateTimeFormat().resolvedOptions().timeZone||''; }catch(e){}
  var answers={}; for (var k in state.a) answers[k]=state.a[k];
  answers.v=1;
  if (state.t0) answers.secs=Math.round((Date.now()-state.t0)/1000);
  var body=JSON.stringify({ p_email:email, p_source:src, p_referrer:ref, p_lang:navigator.language||'', p_tz:tz, p_answers:answers });
  var attempt=0;
  function once(){
    return fetch(SUPA+'/rest/v1/rpc/join_waitlist',{ method:'POST', headers:{ 'apikey':KEY, 'Content-Type':'application/json' }, body:body })
      .then(function(r){ if(r.ok) return r.json(); throw new Error('http '+r.status); });
  }
  function run(){
    return once().catch(function(err){
      console.error('join_waitlist', err);
      if (++attempt<3) return new Promise(function(ok){ setTimeout(ok, 700*attempt); }).then(run);
      return null;
    });
  }
  return run();
}

function showDone(fresh){
  $('barFill').style.width='100%'; $('stepTxt').textContent=''; $('backBtn').hidden=true;
  var el=$('screen'); el.className='screen'; el.innerHTML=doneHTML(state.already); void el.offsetWidth; el.className='screen in';
  if (fresh) confetti(140);
  $('shareBtn').addEventListener('click', function(){
    var url=location.origin+location.pathname+'?src=friend';
    var t=TYPES[state.a.style]||TYPES.wing;
    var data={ title:'Guidr', text:'I’m '+t[1]+' '+t[0]+' What kind of traveler are you? Find out in 60 sec (and get 1 month of Guidr free)', url:url };
    if (navigator.share){ navigator.share(data).catch(function(){}); return; }
    if (navigator.clipboard){ navigator.clipboard.writeText(url).then(function(){ say('','Link copied ✓'); }, function(){ say('', url); }); }
    else say('', url);
  });
}

/* ---------- confetti (no library) ---------- */
function confetti(n){
  if (reduced) return;
  var c=$('confetti'), x=c.getContext('2d'), W=c.width=innerWidth*devicePixelRatio, H=c.height=innerHeight*devicePixelRatio, d=devicePixelRatio;
  var cols=['#FF8A2A','#FFC37A','#FFFFFF','#3BE38B','#4FC3FF','#FF5DA2'], ps=[];
  for (var k=0;k<n;k++) ps.push({ x:W*(0.5+(Math.random()-.5)*.3), y:H*.45, vx:(Math.random()-.5)*16*d, vy:(-Math.random()*16-6)*d,
    w:(5+Math.random()*6)*d, h:(8+Math.random()*8)*d, r:Math.random()*6, vr:(Math.random()-.5)*.4, c:cols[k%cols.length] });
  var t0=performance.now();
  (function f(now){
    var t=now-t0; x.clearRect(0,0,W,H);
    ps.forEach(function(p){ p.vy+=.45*d; p.vx*=.99; p.x+=p.vx; p.y+=p.vy; p.r+=p.vr;
      x.save(); x.globalAlpha=Math.max(0,1-t/2600); x.translate(p.x,p.y); x.rotate(p.r); x.fillStyle=p.c; x.fillRect(-p.w/2,-p.h/2,p.w,p.h*Math.abs(Math.cos(p.r*2))); x.restore(); });
    if (t<2600) requestAnimationFrame(f); else x.clearRect(0,0,W,H);
  })(t0);
}

/* ---------- visitor counter: one count per browser, shown under the button ---------- */
var VKEY='guidr_vid';
function vid(){
  var v=null; try{ v=localStorage.getItem(VKEY); }catch(e){}
  if (!v || !/^[0-9a-f-]{36}$/.test(v)){
    v = (crypto.randomUUID ? crypto.randomUUID() : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,function(ch){var r=Math.random()*16|0;return (ch==='x'?r:(r&3|8)).toString(16);}));
    try{ localStorage.setItem(VKEY,v); }catch(e){}
  }
  return v;
}
function visit(started){
  var src=(new URLSearchParams(location.search).get('src')||'direct').toLowerCase();
  return fetch(SUPA+'/rest/v1/rpc/record_visit',{ method:'POST', headers:{ 'apikey':KEY, 'Content-Type':'application/json' },
    body:JSON.stringify({ p_visitor:vid(), p_source:src, p_started:!!started }) })
    .then(function(r){ return r.ok ? r.json() : null; }).catch(function(){ return null; });
}
var shownCount=0;
function showCount(n){
  if (!Number.isFinite(n) || n<1) return;
  var el=$('count'), from=shownCount; shownCount=n;
  $('countLabel').textContent = n===1 ? 'traveler visited' : 'travelers visited';
  $('counter').classList.add('show');
  if (reduced){ el.textContent=n.toLocaleString(); return; }
  var t0=performance.now(), ms=Math.min(1200, 300+Math.abs(n-from)*20);
  (function step(now){ var p=Math.min(1,(now-t0)/ms); el.textContent=Math.round(from+(n-from)*(1-Math.pow(1-p,3))).toLocaleString(); if(p<1) requestAnimationFrame(step); })(t0);
}
visit(false).then(function(r){ if (r && r.ok) showCount(Number(r.total)); });

function startQuiz(){
  document.body.classList.add('quiz');
  visit(true);
  if (state.done){ showDone(); }
  else render(1);
  window.scrollTo(0,0);
}
$('startBtn').addEventListener('click', startQuiz);
if (state.done) { $('startBtn').textContent='You’re in ✅'; $('hint').textContent='Your free month is saved'; }
else if (Object.keys(state.a).length){ $('startBtn').textContent='Continue →'; $('hint').textContent='Your answers are saved'; }
</script>
