<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guidr · What kind of traveler are you?</title>
<meta name="description" content="Find your travel type in 60 seconds and help us build Guidr.">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
<meta name="theme-color" content="#0B43B5">
<style>html,body{margin:0;min-height:100%;background:#0B43B5}body{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body>
<script>
(function(){
  var source='https://raw.githubusercontent.com/guidrtravel-cmd/waitlist/c0965610885c6c08ad3d41c1f29d0b22e441ba63/quiz.html';
  fetch(source).then(function(r){if(!r.ok)throw Error('load');return r.text();}).then(function(html){
    var counterPatch='<div class="counter glass sm" id="counter"><span class="dot"></span><span><b id="count">0</b> <span id="countLabel">travelers visited</span></span></div>';
    var xPatch='<div class="nav-actions">'+counterPatch+'<a class="x glass sm" href="https://x.com/guidrtravel" target="_blank" rel="noopener" aria-label="Guidr on X"><svg viewBox="0 0 24 24"><path d="M18.9 1.2h3.7l-8.1 9.2L24 22.8h-7.4l-5.8-7.6-6.7 7.6H.4l8.6-9.9L0 1.2h7.6l5.2 6.9zm-1.3 19.4h2L6.5 3.3H4.3z"/></svg></a></div>';
    var css='<style>.nav-actions{display:flex;align-items:center;justify-content:flex-end;gap:10px;min-width:0}.nav-actions .counter{display:inline-flex!important;flex:0 1 auto;min-width:0;max-width:calc(100vw - 126px);overflow:hidden}.nav-actions .counter>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nav-actions .x{flex:0 0 44px}.nav-actions .x svg{width:16px;height:16px}.meta #counter{display:none!important}body.quiz .counter{display:inline-flex!important}.done-title{font-family:Instrument Serif,Georgia,serif;font-size:38px;line-height:1.05;margin-top:10px}.done-copy{max-width:360px;margin:10px auto 0;color:rgba(255,255,255,.82);font-size:15px;line-height:1.55}.done-kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.72)}@media(max-width:600px){nav{gap:8px}.nav-actions{gap:7px}.nav-actions .counter{height:40px;padding:0 10px;font-size:12px}.nav-actions .counter .dot{width:6px;height:6px}.nav-actions .x{flex-basis:40px;width:40px;height:40px}.nav-actions .x svg{width:15px;height:15px}}@media(max-width:360px){.nav-actions .counter{font-size:11px;padding:0 8px}.nav-actions .counter #countLabel{display:none}.nav-actions .counter{max-width:82px}}</style>';
    html=html.replace('</style>',css+'</style>');
    html=html.replace(/<div class="counter glass sm" id="counter">[\s\S]*?<\/div>\s*/, '');
    html=html.replace('  </nav>', '    '+xPatch+'\n  </nav>');
    html=html.replace('var state = load() || { a:{}, i:0, t0:0, done:false };','var state = { a:{}, i:0, t0:0, done:false };');
    html=html.replace('Your travel type is ready','You’re on the list');
    html=html.replace('Send it to a friend','Share Guidr');
    html=html.replace('Your free month code arrives the day Guidr drops.','Your free month is saved. We’ll send your code when Guidr launches.');
    document.open();document.write(html);document.close();
  }).catch(function(){document.body.textContent='Guidr is loading. Please refresh.';});
})();
</script>
</body>
</html>
