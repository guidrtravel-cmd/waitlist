<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guidr · What kind of traveler are you?</title>
<meta name="theme-color" content="#0B43B5">

<style>html,body{margin:0;min-height:100%;background:#0B43B5}body{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body>
<script>
(function(){
  var source='https://raw.githubusercontent.com/guidrtravel-cmd/waitlist/c0965610885c6c08ad3d41c1f29d0b22e441ba63/quiz.html';
  fetch(source).then(function(r){if(!r.ok)throw Error('load');return r.text();}).then(function(html){
    var counterPatch='<div class="counter glass sm" id="counter"><span class="dot"></span><span><b id="count">0</b> <span id="countLabel">travelers visited</span></span></div>';
    var xPatch='<div class="nav-actions">'+counterPatch+'<a class="x glass sm" href="https://x.com/guidrtravel" target="_blank" rel="noopener" aria-label="Guidr on X"><svg viewBox="0 0 24 24"><path d="M18.9 1.2h3.7l-8.1 9.2L0 1.2h7.6l5.2 6.9 6.1-6.9h3.7l-8.6 9.9L24 22.8h-7.4l-5.8-7.6-6.7 7.6h-3.7l8.6 9.9z"/></svg></a></div>';
    var css='<style>nav{position:relative}.nav-actions{position:absolute;top:0;right:0;display:flex!important;align-items:center!important;gap:10px!important;width:max-content!important;max-width:calc(100vw - 32px)!important}.nav-actions .counter{display:inline-flex!important;flex:0 1 auto!important;max-width:calc(100vw - 126px)!important;overflow:hidden!important}.nav-actions .counter>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nav-actions .x{display:flex!important;flex:0 0 44px!important}.meta #counter{display:none!important}.opts.grid2 .opt:last-child:nth-child(odd){grid-column:1 / -1;width:50%;justify-self:center}.card:has(#shareBtn) .top{display:none!important}.card:has(#shareBtn){padding:24px 28px 26px}.card:has(#shareBtn) .screen{margin-top:0}.card:has(#shareBtn) .center{padding:0}.card:has(#shareBtn) .big{font-size:56px;line-height:1}.card:has(#shareBtn) .done-kicker{margin-top:12px;font-size:12px}.card:has(#shareBtn) .done-title{margin-top:8px;font-size:32px;line-height:1.08;text-wrap:balance}.card:has(#shareBtn) .done-copy{max-width:410px;margin:12px auto 0;font-size:15px;line-height:1.5;text-wrap:pretty}.card:has(#shareBtn) .done-reward{margin:16px auto 0;padding:12px 16px;border-radius:16px;background:rgba(255,166,91,.16);box-shadow:inset 0 0 0 1px rgba(255,193,133,.42);font-size:14px;line-height:1.45;max-width:400px}.card:has(#shareBtn) .next{margin-top:16px}@media(max-width:600px){.nav-actions{gap:7px!important}.nav-actions .counter{height:40px;padding:0 10px;font-size:12px}.nav-actions .x{flex-basis:40px;width:40px;height:40px}.card:has(#shareBtn){padding:20px 18px 20px}.card:has(#shareBtn) .big{font-size:48px}.card:has(#shareBtn) .done-title{font-size:28px}.card:has(#shareBtn) .done-copy{font-size:14px;margin-top:10px}.card:has(#shareBtn) .done-reward{margin-top:12px;font-size:13px;padding:11px 13px}}@media(max-width:360px){.nav-actions .counter{font-size:11px;padding:0 8px;max-width:82px}.nav-actions .counter #countLabel{display:none}}</style>';
    html=html.replace('</style>',css+'</style>');
    html=html.replace(/<div class="counter glass sm" id="counter">[\s\S]*?<\/div>\s*/, '');
    html=html.replace('  </nav>', '    '+xPatch+'\n  </nav>');
    html=html.replace('var state = load() || { a:{}, i:0, t0:0, done:false };','var state = { a:{}, i:0, t0:0, done:false };');
    html=html.replace(/function flow\(\)\{[\s\S]*?\n\}/, "function flow(){ var f=[]; QUESTIONS.forEach(function(q){ if(q.id==='style') return; if(q.id==='price' && (!state.a.pay || state.a.pay==='free')) return; f.push(q.id); if(q.id==='pain') f.push('half'); }); f.push('email'); return f; }");
    html=html.replace(/function halfHTML\(\)\{[\s\S]*?\n\}/, "function halfHTML(){ return '<div class=\"center half\"><div class=\"big\">✈️</div><h2 class=\"q\">Halfway there!</h2></div>'; }");
    html=html.replace(/\{ id:'beta',[\s\S]*?\}\s*\]\);/, "{ id:'beta', q:'Want to test Guidr early, before it launches?', opts:[['yes','Yes'],['no','No']] }\n];");
    html=html.replace(/function emailHTML\(\)\{[\s\S]*?\n\}/, "function emailHTML(){ return '<div class=\"center\" style=\"padding-bottom:0\"><div class=\"big\">🎉</div><h2 class=\"q\">Join the Guidr waitlist</h2><p class=\"sub\">Enter your email to reserve your spot and get <b style=\"color:#FFC98F\">1 month free</b> when Guidr launches.</p></div><form class=\"form\" id=\"form\" novalidate><input type=\"email\" id=\"email\" placeholder=\"you@email.com\" autocomplete=\"email\" inputmode=\"email\" aria-label=\"Email address\" required><button type=\"submit\" class=\"cta\" id=\"sendBtn\">Reserve my free month</button></form><p class=\"msg\" id=\"msg\" role=\"status\"></p><p class=\"fine\">Your free-month code will be emailed when Guidr launches. No spam. <a href=\"privacy.html\">Privacy</a></p>'; }");
    html=html.replace(/function doneHTML\(already\)\{[\s\S]*?\n\}/, "function doneHTML(already){ return '<div class=\"center\"><div class=\"big\">🎉</div><div class=\"done-kicker\">You’re officially on the list</div><div class=\"done-title\">Your trip planning, handled.</div><p class=\"done-copy\">Guidr turns the places you save into a trip that fits you, with routes, timing, and the best stops in the right order.</p><div class=\"done-reward\"><b style=\"color:#FFC98F\">Your 1-month-free code is reserved.</b><br>We’ll email it when Guidr launches.</div></div><button type=\"button\" class=\"cta next\" id=\"shareBtn\">Share Guidr</button><p class=\"msg\" id=\"msg\" role=\"status\"></p>'; }");
    html=html.replace(/Show my type \+ free month/g,'Reserve my free month');
    html=html.replace(/Claim my free month/g,'Reserve my free month');
    html=html.replace("function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }", "function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }\nvar PROGRESS_RPC=SUPA+'/rest/v1/rpc/save_quiz_progress';\nvar progressTimer=0;\nfunction saveProgress(){\n  var answers={}; for(var k in state.a) answers[k]=state.a[k]; answers.v=1;\n  var body=JSON.stringify({p_visitor:vid(),p_answers:answers,p_step:state.i,p_started:!!state.t0});\n  clearTimeout(progressTimer);\n  progressTimer=setTimeout(function(){ fetch(PROGRESS_RPC,{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json','Accept':'application/json'},body:body,keepalive:true,cache:'no-store'}).then(function(r){if(!r.ok)throw Error('autosave '+r.status);}).catch(function(){ setTimeout(function(){ fetch(PROGRESS_RPC,{method:'POST',headers:{'apikey':KEY,'Content-Type':'application/json'},body:body,cache:'no-store'}).catch(function(){}); },500); }); },40);\n}")
    html=html.replace("state.a[q.id]=arr; save();", "state.a[q.id]=arr; save(); saveProgress();")
    html=html.replace("state.a[q.id]=v; save();", "state.a[q.id]=v; save(); saveProgress();")
    html=html.replace("visit(true);", "visit(true); saveProgress();")
    document.open();document.write(html);document.close();
  }).catch(function(){document.body.textContent='Guidr is loading. Please refresh.';});
})();
</script>
</body>
</html>
