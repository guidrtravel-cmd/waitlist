<script>
(function(){
  var source='https://raw.githubusercontent.com/guidrtravel-cmd/waitlist/c0965610885c6c08ad3d41c1f29d0b22e441ba63/quiz.html';
  fetch(source).then(function(r){if(!r.ok)throw Error('load');return r.text();}).then(function(html){
    var counterPatch='<div class="counter glass sm" id="counter"><span class="dot"></span><span><b id="count">0</b> <span id="countLabel">travelers visited</span></span></div>';
    var xPatch='<div class="nav-actions">'+counterPatch+'<a class="x glass sm" href="https://x.com/guidrtravel" target="_blank" rel="noopener" aria-label="Guidr on X"><svg viewBox="0 0 24 24"><path d="M18.9 1.2h3.7l-8.1 9.2L24 22.8h-7.4l-5.8-7.6-6.7 7.6H.4l8.6-9.9L0 1.2h7.6l5.2 6.9zm-1.3 19.4h2L6.5 3.3H4.3z"/></svg></a></div>';
    var css='<style>nav{position:relative}.nav-actions{position:absolute;top:0;right:0;display:flex!important;flex-direction:row!important;align-items:center!important;justify-content:flex-end!important;gap:10px!important;width:max-content!important;min-width:0!important;max-width:calc(100vw - 32px)!important}.nav-actions .counter{display:inline-flex!important;position:static!important;flex:0 1 auto!important;order:1!important;max-width:calc(100vw - 126px)!important;overflow:hidden!important}.nav-actions .counter>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nav-actions .x{display:flex!important;position:static!important;flex:0 0 44px!important;order:2!important}.nav-actions .x svg{width:16px;height:16px}.meta #counter{display:none!important}body.quiz .counter{display:inline-flex!important}.done-title{font-family:Instrument Serif,Georgia,serif;font-size:38px;line-height:1.05;margin-top:10px}.done-copy{max-width:380px;margin:10px auto 0;color:rgba(255,255,255,.86);font-size:15px;line-height:1.55}.done-kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.78)}@media(max-width:600px){nav{gap:8px}.nav-actions{right:0;gap:7px!important;max-width:calc(100vw - 32px)!important}.nav-actions .counter{height:40px;padding:0 10px;font-size:12px}.nav-actions .counter .dot{width:6px;height:6px}.nav-actions .x{flex-basis:40px;width:40px;height:40px}.nav-actions .x svg{width:15px;height:15px}}@media(max-width:360px){.nav-actions .counter{font-size:11px;padding:0 8px}.nav-actions .counter #countLabel{display:none}.nav-actions .counter{max-width:82px}}</style>';
    html=html.replace('</style>',css+'</style>');
    html=html.replace(/<div class="counter glass sm" id="counter">[\s\S]*?<\/div>\s*/, '');
    html=html.replace('  </nav>', '    '+xPatch+'\n  </nav>');
    html=html.replace('var state = load() || { a:{}, i:0, t0:0, done:false };','var state = { a:{}, i:0, t0:0, done:false };');
    html=html.replace("['yes','🙋 Yes, I’d test it'],['maybe','🤔 Maybe'],['no','No thanks']", "['yes','Yes, I’d test Guidr early'],['no','No thanks']");
    html=html.replace("Drop your email to see it and get <b style=\"color:#FFC98F\">1 month free</b> when Guidr launches.", "Enter your email to reserve your spot and get <b style=\"color:#FFC98F\">1 month free</b> when Guidr launches.");
    html=html.replace("<button type=\"submit\" class=\"cta\" id=\"sendBtn\">Show my type + free month</button>", "<button type=\"submit\" class=\"cta\" id=\"sendBtn\">Reserve my free month</button>");
    html=html.replace("btn.textContent='Show my type + free month';", "btn.textContent='Reserve my free month';");
    html=html.replace(/function doneHTML\(already\)\{[\s\S]*?\n\}\n\nvar halfTimer/, "function doneHTML(already){\n  return '<div class=\"center\"><div class=\"big\">🎉</div><div class=\"done-kicker\">You’re on the list</div><div class=\"done-title\">Guidr will do the planning.</div><p class=\"done-copy\">We’ll turn the places you save into a trip that fits you, with routes, timings, and the best stops in the right order.</p><p class=\"sub\" style=\"margin-top:14px\"><b style=\"color:#FFC98F\">Your 1-month-free code is reserved.</b> We’ll email it when Guidr launches.</p></div>'+'<button type=\"button\" class=\"cta next\" id=\"shareBtn\">Share Guidr</button>'+'<p class=\"msg\" id=\"msg\" role=\"status\"></p>'\n}\n\nvar halfTimer");
    document.open();document.write(html);document.close();
  }).catch(function(){document.body.textContent='Guidr is loading. Please refresh.';});
})();
</script>
</body>
</html>
