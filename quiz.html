<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Guidr · What kind of traveler are you?</title>
<meta name="description" content="Find your travel type in 60 seconds and help us build Guidr.">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
<meta name="theme-color" content="#0B43B5">
<style>html,body{margin:0;min-height:100%;background:#0B43B5}body{font-family:Inter,system-ui,sans-serif}</style>
</head>
<body>
<script>
(function(){
  var source='https://raw.githubusercontent.com/guidrtravel-cmd/waitlist/c0965610885c6c08ad3d41c1f29d0b22e441ba63/quiz.html';
  fetch(source).then(function(r){if(!r.ok)throw Error('load');return r.text();}).then(function(html){
    var counterPatch='<div class="counter glass sm" id="counter"><span class="dot"></span><span><b id="count">0</b> <span id="countLabel">travelers visited</span></span></div>';
    var xPatch='<div class="nav-actions">'+counterPatch+'<a class="x glass sm" href="https://x.com/guidrtravel" target="_blank" rel="noopener" aria-label="Guidr on X"><svg viewBox="0 0 24 24"><path d="M18.9 1.2h3.7l-8.1 9.2L6.5 3.3H4.3z"/></svg></a></div>';
    var css='<style>nav{position:relative}.nav-actions{position:absolute;top:0;right:0;display:flex!important;align-items:center!important;gap:10px!important;width:max-content!important;max-width:calc(100vw - 32px)!important}.nav-actions .counter{display:inline-flex!important;flex:0 1 auto!important;max-width:calc(100vw - 126px)!important;overflow:hidden!important}.nav-actions .counter>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.nav-actions .x{display:flex!important;flex:0 0 44px!important}.meta #counter{display:none!important}.done-title{font-family:Instrument Serif,Georgia,serif;font-size:38px;line-height:1.05;margin-top:10px}.done-copy{max-width:380px;margin:10px auto 0;color:rgba(255,255,255,.86);font-size:15px;line-height:1.55}.done-kicker{font-size:12px;letter-spacing:.16em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.78)}@media(max-width:600px){.nav-actions{gap:7px!important}.nav-actions .counter{height:40px;padding:0 10px;font-size:12px}.nav-actions .x{flex-basis:40px;width:40px;height:40px}}@media(max-width:360px){.nav-actions .counter{font-size:11px;padding:0 8px;max-width:82px}.nav-actions .counter #countLabel{display:none}}</style>';
    html=html.replace('</style>',css+'</style>');
    html=html.replace(/<div class="counter glass sm" id="counter">[\s\S]*?<\/div>\s*/, '');
    html=html.replace('  </nav>', '    '+xPatch+'\n  </nav>');
    html=html.replace('var state = load() || { a:{}, i:0, t0:0, done:false };','var state = { a:{}, i:0, t0:0, done:false };');
    html=html.replace(/\{ id:'style',[\s\S]*?\}\s*,\s*\{ id:'pain'/, "{ id:'pain'");
    html=html.replace(/\{ id:'beta',[\s\S]*?\}\s*\]\);/, "{ id:'beta', q:'Want to test Guidr early, before it launches?', opts:[['yes','Yes'],['no','No']] }\n];");
    html=html.replace(/function halfHTML\(\)\{[\s\S]*?\n\}/, "function halfHTML(){ return '<div class=\"center half\"><div class=\"big\">✈️</div><h2 class=\"q\">Halfway there!</h2></div>'; }");
    html=html.replace(/function emailHTML\(\)\{[\s\S]*?\n\}/, "function emailHTML(){ return '<div class=\"center\" style=\"padding-bottom:0\"><div class=\"big\">🎉</div><h2 class=\"q\">Join the Guidr waitlist</h2><p class=\"sub\">Enter your email to reserve your spot and get <b style=\"color:#FFC98F\">1 month free</b> when Guidr launches.</p></div><form class=\"form\" id=\"form\" novalidate><input type=\"email\" id=\"email\" placeholder=\"you@email.com\" autocomplete=\"email\" inputmode=\"email\" aria-label=\"Email address\" required><button type=\"submit\" class=\"cta\" id=\"sendBtn\">Reserve my free month</button></form><p class=\"msg\" id=\"msg\" role=\"status\"></p><p class=\"fine\">Your free-month code will be emailed when Guidr launches. No spam. <a href=\"privacy.html\">Privacy</a></p>'; }");
    html=html.replace(/function doneHTML\(already\)\{[\s\S]*?\n\}/, "function doneHTML(already){ return '<div class=\"center\"><div class=\"big\">🎉</div><div class=\"done-kicker\">You’re in</div><div class=\"done-title\">Guidr does the planning.</div><p class=\"done-copy\">Save the places you love and Guidr will build the trip for you, with routes, timing, and the best stops in the right order.</p><p class=\"sub\" style=\"margin-top:14px\"><b style=\"color:#FFC98F\">Your 1-month-free code is reserved.</b> We’ll email it to you when Guidr launches.</p></div><button type=\"button\" class=\"cta next\" id=\"shareBtn\">Share Guidr</button><p class=\"msg\" id=\"msg\" role=\"status\"></p>'; }");
    html=html.replace(/Show my type \+ free month/g,'Reserve my free month');
    html=html.replace(/Claim my free month/g,'Reserve my free month');
    document.open();document.write(html);document.close();
  }).catch(function(){document.body.textContent='Guidr is loading. Please refresh.';});
})();
</script>
</body>
</html>
