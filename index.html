<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guidr · Join the waitlist</title></head>
<body>
<script>
fetch('https://raw.githubusercontent.com/guidrtravel-cmd/waitlist/cb2529ebf62602496676a0ed052051265d09fcef/index.html')
  .then(r=>r.text())
  .then(html=>{
    const onePage=`
/* One-page constraint only. Counter, glass, and content remain unchanged. */
html,body{height:100%;overflow:hidden!important}
.stage,.page{height:100svh!important;min-height:100svh!important;overflow:hidden!important}
.hero{min-height:0!important;padding-top:4px!important;padding-bottom:8px!important}
.card{margin-top:12px!important;padding-top:20px!important;padding-bottom:12px!important}
.meta{margin-top:8px!important;gap:6px!important}
footer{padding-top:6px!important;padding-bottom:max(10px,env(safe-area-inset-bottom))!important}
@media(max-width:600px){
  nav{margin-top:10px!important}
  .hero{padding-top:4px!important;padding-bottom:54px!important}
  h1{margin-top:14px!important}
  .lede{margin-top:10px!important}
  .card{margin-top:12px!important;padding:20px 18px 12px!important}
  .offer{margin-top:12px!important;padding:11px 13px!important}
  .form{margin-top:11px!important}
  .fine{margin-top:7px!important}
  .meta{margin-top:7px!important;gap:6px!important}
}
`;
    document.open();document.write(html.replace('</style>',onePage+'\\n</style>'));document.close();
  })
  .catch(()=>{document.body.textContent='Guidr is loading. Please refresh.'});
</script>
</body>
</html>
