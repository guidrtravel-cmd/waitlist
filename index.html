<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guidr · Join the waitlist</title></head>
<body>
<script>
fetch('https://raw.githubusercontent.com/guidrtravel-cmd/waitlist/cb2529ebf62602496676a0ed052051265d09fcef/index.html')
  .then(r=>r.text())
  .then(html=>{
    const layoutFix=`
/* Layout-only fix. Glass styles intentionally untouched. */
.hero{justify-content:flex-start!important;padding-top:clamp(18px,4.5vh,42px)!important;padding-bottom:72px!important}
.card{margin-top:clamp(18px,3vh,28px)!important}
.meta{margin-top:14px!important;gap:10px!important}
footer{padding-top:8px!important}
@media(max-height:820px) and (min-width:601px){
  nav{margin-top:14px!important}
  .hero{padding-top:12px!important;padding-bottom:58px!important}
  h1{margin-top:14px!important}
  .lede{margin-top:10px!important}
  .card{margin-top:16px!important;padding-top:24px!important;padding-bottom:18px!important}
  .offer{margin-top:14px!important}
  .form{margin-top:14px!important}
  .fine{margin-top:8px!important}
  .meta{margin-top:10px!important;gap:8px!important}
}
@media(max-width:600px){
  .hero{justify-content:flex-start!important;padding:18px 0 70px!important}
  .card{margin-top:16px!important;padding-top:22px!important;padding-bottom:16px!important}
  .meta{margin-top:12px!important;gap:9px!important}
}
`;
    document.open();document.write(html.replace('</style>',layoutFix+'\\n</style>'));document.close();
  })
  .catch(()=>{document.body.textContent='Guidr is loading. Please refresh.'});
</script>
</body>
</html>
