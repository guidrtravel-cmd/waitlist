<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guidr · Join the waitlist</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=1">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
</head>
<body>
<script>
fetch('https://raw.githubusercontent.com/guidrtravel-cmd/waitlist/cb2529ebf62602496676a0ed052051265d09fcef/index.html')
  .then(r=>r.text())
  .then(html=>{
    const fixes=`
/* Requested final layout: no footer, visible counter, one viewport. */
html,body{height:100%;overflow:hidden!important}
.stage,.page{height:100svh!important;min-height:100svh!important;overflow:hidden!important}
footer{display:none!important}
#counter{display:inline-flex!important;visibility:visible!important;opacity:1!important}
.hero{min-height:0!important;padding-top:4px!important;padding-bottom:8px!important}
.card{margin-top:12px!important;padding-top:20px!important;padding-bottom:12px!important}
.meta{display:flex!important;visibility:visible!important;opacity:1!important;margin-top:8px!important;gap:6px!important}
@media(max-width:600px){nav{margin-top:10px!important}.hero{padding-top:4px!important;padding-bottom:18px!important}h1{margin-top:14px!important}.lede{margin-top:10px!important}.card{margin-top:12px!important;padding:20px 18px 12px!important}.offer{margin-top:12px!important;padding:11px 13px!important}.form{margin-top:11px!important}.fine{margin-top:7px!important}.meta{margin-top:7px!important;gap:6px!important}}
/* The status message replaces the fine-print line instead of adding a new row,
   so signing up never makes the page taller (which pushed the stores off-screen). */
.msg:not(:empty){margin-top:12px;line-height:1.4}
.card:has(.msg:not(:empty)) .fine{display:none}
@media(max-width:600px){.msg:not(:empty){margin-top:7px!important;font-size:13px}}

/* ---------- glass v2 ----------
   Frosted, not tinted: heavy blur with only a touch of saturation, so the card reads
   as a slab of milky glass over the photo instead of a bright cyan panel.
   Thickness comes from the edge: a bright top lip, a soft inner glow all round
   (the bevel), and a hairline rim that catches a faint prism of colour.
   Everything lives in box-shadow + ::before, so ::after stays free for the counter. */
.glass{
  background:
    radial-gradient(130% 90% at 15% -10%,rgba(255,255,255,.26) 0%,rgba(255,255,255,0) 55%),
    linear-gradient(180deg,rgba(255,255,255,.16) 0%,rgba(255,255,255,.07) 60%,rgba(255,255,255,.11) 100%);
  -webkit-backdrop-filter:blur(26px) saturate(1.2) brightness(1.03);
  backdrop-filter:blur(26px) saturate(1.2) brightness(1.03);
  box-shadow:
    inset 0 1.5px 0 rgba(255,255,255,.75),
    inset 0 -1px 0 rgba(255,255,255,.22),
    inset 0 0 0 1px rgba(255,255,255,.14),
    inset 0 0 22px 2px rgba(255,255,255,.14),
    inset 0 10px 24px -14px rgba(255,255,255,.45),
    0 1px 2px rgba(3,20,60,.10),
    0 26px 56px -24px rgba(3,20,60,.55);
}
.glass::before{
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:-1;
  padding:1.25px;
  background:conic-gradient(from 200deg at 50% 50%,
    rgba(255,255,255,.95) 0deg,
    rgba(186,222,255,.55) 30deg,
    rgba(255,206,236,.40) 55deg,
    rgba(255,255,255,.12) 95deg,
    rgba(255,255,255,.06) 160deg,
    rgba(206,255,236,.30) 215deg,
    rgba(255,232,196,.38) 250deg,
    rgba(255,255,255,.75) 310deg,
    rgba(255,255,255,.95) 360deg);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
  -webkit-mask-composite:xor;
  mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0);
}
.glass.sm{
  -webkit-backdrop-filter:blur(14px) saturate(1.2) brightness(1.04);
  backdrop-filter:blur(14px) saturate(1.2) brightness(1.04);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.75),
    inset 0 -1px 0 rgba(255,255,255,.2),
    inset 0 0 0 1px rgba(255,255,255,.14),
    inset 0 0 12px 1px rgba(255,255,255,.14),
    0 1px 2px rgba(3,20,60,.10),
    0 10px 24px -12px rgba(3,20,60,.5);
}
.glass.sm::before{padding:1px}

/* Hide the G icon in the nav, show only the wordmark (desktop AND mobile). */
.brand .icon,#logoIcon,nav .brand svg.icon{display:none!important;width:0!important;height:0!important}

/* Orange counter number + celebration when someone signs up.
   The pill itself is never given a new animation: it already has its entrance
   animation, and swapping that out and back replays the entrance (the jump). */
#count{color:#FF8A2A;display:inline-block;transform-origin:50% 60%}
@media (prefers-reduced-motion:no-preference){
#counter.celebrate #count{animation:npop .6s cubic-bezier(.2,.9,.3,1.3) both}
#counter.celebrate::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;box-shadow:0 0 0 0 rgba(255,138,42,.7);animation:cring .9s ease-out both}
#counter .plus1{position:absolute;right:12px;top:-4px;color:#FF8A2A;font-size:14px;font-weight:700;pointer-events:none;text-shadow:0 1px 8px rgba(3,24,70,.3);animation:cplus 1.1s ease-out forwards}
@keyframes npop{0%{transform:scale(1)}40%{transform:scale(1.3)}100%{transform:scale(1)}}
@keyframes cring{to{box-shadow:0 0 0 14px rgba(255,138,42,0)}}
@keyframes cplus{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-24px)}}
}

/* ---------- mobile ----------
   Same content, same order, just sized for a phone. Two real bugs fixed here:
   1. The hero was vertically centred inside a box shorter than its content, so the
      overflow went UP and the pill slid over the logo. safe center stops that.
   2. Everything was desktop-sized, so the stores row fell off the bottom.
   If a very short phone still can't fit it, the page scrolls instead of cutting off. */
@media(max-width:600px){
  html,body{height:auto!important;overflow-x:hidden!important;overflow-y:auto!important}
  .stage,.page{height:auto!important;min-height:100svh!important;overflow:visible!important}
  .page{padding:0 16px!important}
  nav{margin-top:10px!important;height:40px!important}
  .brand{height:40px!important;gap:8px!important}
  .brand .icon,#logoIcon{display:none!important;width:0!important;height:0!important}
  .brand .word{height:36px!important;width:62px!important;margin-top:6px!important}
  .x{width:40px!important;height:40px!important}
  .hero{justify-content:safe center!important;padding-top:14px!important;padding-bottom:max(14px,env(safe-area-inset-bottom))!important}
  .pill{padding:7px 13px 7px 11px!important;font-size:10.5px!important;letter-spacing:.15em!important}
  h1{margin-top:12px!important;font-size:clamp(38px,11vw,46px)!important;line-height:1!important}
  .lede{margin-top:8px!important;font-size:14.5px!important;line-height:1.5!important;max-width:340px!important}
  .card{margin-top:14px!important;padding:16px 16px 11px!important;border-radius:26px!important}
  .card h2{font-size:26px!important}
  .card .csub{margin-top:4px!important;font-size:13px!important}
  .offer{margin-top:11px!important;padding:10px 12px!important;gap:11px!important;border-radius:16px!important}
  .offer .ico{width:36px!important;height:36px!important;border-radius:12px!important}
  .offer .ico svg{width:19px!important;height:19px!important}
  .offer b{font-size:14px!important}
  .offer span{font-size:12.5px!important;line-height:1.4!important}
  .form{margin-top:11px!important;gap:8px!important}
  .form input,.form button{height:48px!important;border-radius:24px!important}
  .form input{font-size:16px!important;padding:0 18px!important}
  .fine{margin-top:7px!important;font-size:11.5px!important}
  .meta{margin-top:10px!important;gap:8px!important}
  .counter{height:36px!important;padding:0 16px!important;font-size:13.5px!important}
  .stores{font-size:13px!important;gap:8px 14px!important}
  .store svg{width:15px!important;height:15px!important}
}
`;
    const celebrateFn='function celebrate(){if(reduced)return;var c=$("counter");c.classList.remove("celebrate");void c.offsetWidth;c.classList.add("celebrate");var p=document.createElement("span");p.className="plus1";p.textContent="+1";c.appendChild(p);setTimeout(function(){p.remove();},1200);}\n';
    const newJoin='roll(Number.isFinite(res.total) ? res.total : shown + 1);';
    /* Favicon: the rewritten page's own icon tag starts with an empty href, which
       made the tab fall back to a globe. Point it at the real file from the start. */
    const patched=html.replace('const MIN_SHOW = 1;','const MIN_SHOW = 0;').replace('loadCount();','roll(0); loadCount();').replace('</style>',fixes+'\n</style>')
      .replace('<link rel="icon" id="fav" type="image/svg+xml" href="">','<link rel="icon" id="fav" type="image/svg+xml" href="favicon.svg?v=1">')
      .replace('<svg class="icon" id="logoIcon" aria-hidden="true"','<svg class="icon" id="logoIcon" aria-hidden="true" style="display:none"')
      .replace('function say(',()=>celebrateFn+'function say(')
      .replace(newJoin,()=>newJoin+' celebrate();');
    document.open();document.write(patched);document.close();
  })
  .catch(()=>{document.body.textContent='Guidr is loading. Please refresh.'});
</script>
</body>
</html>
