<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guidr · Join the waitlist</title>
</head>
<body>
<script>
fetch('https://raw.githubusercontent.com/guidrtravel-cmd/waitlist/cb2529ebf62602496676a0ed052051265d09fcef/index.html')
  .then(r=>r.text())
  .then(html=>{
    const glassFix=`
/* unified ocean-glass treatment */
.glass{
  background:rgba(22,48,73,.42)!important;
  -webkit-backdrop-filter:blur(22px) saturate(1.35)!important;
  backdrop-filter:blur(22px) saturate(1.35)!important;
  border:1px solid rgba(225,244,255,.58)!important;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.34),inset 0 -18px 34px rgba(7,28,52,.12),0 18px 40px -20px rgba(2,18,42,.58)!important;
}
.glass::before{background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(255,255,255,0) 48%)!important}
.card{background:rgba(22,48,73,.42)!important}
.offer{background:rgba(28,62,91,.34)!important;border:1px solid rgba(225,244,255,.5)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.24),inset 0 -12px 24px rgba(7,28,52,.1)!important}
#counter{display:inline-flex!important}
`;
    const patched=html.replace('</style>',glassFix+'\\n</style>');
    document.open();document.write(patched);document.close();
  })
  .catch(()=>{document.body.textContent='Guidr is loading. Please refresh.'});
</script>
</body>
</html>
