<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Guidr · Join the waitlist</title>
</head>
<body>
<script>
fetch('https://raw.githubusercontent.com/guidrtravel-cmd/waitlist/cb2529ebf62602496676a0ed052051265d09fcef/index.html')
  .then(r=>r.text())
  .then(html=>{
    const glassFix=`
/* Guidr glass system: one material, three elevations */
:root{--glass-fill:rgba(129,205,255,.20);--glass-edge:rgba(235,249,255,.62);--glass-shadow:rgba(3,29,70,.28)}
.glass,.glass.sm{
  position:relative!important;
  background:var(--glass-fill)!important;
  -webkit-backdrop-filter:blur(16px) saturate(1.35)!important;
  backdrop-filter:blur(16px) saturate(1.35)!important;
  border:1px solid var(--glass-edge)!important;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.52),
    inset 0 -1px 0 rgba(52,143,219,.20),
    0 14px 34px -18px var(--glass-shadow)!important;
}
.glass::before{content:""!important;position:absolute!important;inset:0!important;border-radius:inherit!important;pointer-events:none!important;z-index:-1!important;background:linear-gradient(135deg,rgba(255,255,255,.18),rgba(255,255,255,0) 52%)!important}
.card{background:rgba(111,194,248,.22)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.58),inset 0 -1px 0 rgba(31,116,194,.18),0 22px 48px -22px rgba(3,29,70,.38)!important}
.offer{background:rgba(111,194,248,.18)!important;border:1px solid rgba(235,249,255,.54)!important;box-shadow:inset 0 1px 0 rgba(255,255,255,.38),inset 0 -1px 0 rgba(31,116,194,.16)!important}
.form input{background:rgba(4,44,100,.30)!important;border:1px solid rgba(235,249,255,.24)!important}
#counter{display:inline-flex!important;height:40px!important;background:rgba(129,205,255,.20)!important}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass,.glass.sm{background:rgba(26,102,184,.84)!important}}
@media(prefers-reduced-transparency:reduce){.glass,.glass.sm{background:rgba(26,102,184,.92)!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}}
`;
    const patched=html.replace('</style>',glassFix+'\\n</style>');
    document.open();document.write(patched);document.close();
  })
  .catch(()=>{document.body.textContent='Guidr is loading. Please refresh.'});
</script>
</body>
</html>
