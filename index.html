<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guidr · Join the waitlist</title></head>
<body>
<script>
fetch('https://raw.githubusercontent.com/guidrtravel-cmd/waitlist/cb2529ebf62602496676a0ed052051265d09fcef/index.html')
  .then(r=>r.text())
  .then(html=>{
    const layoutOnly=`
/* One-viewport fix only. Glass styling remains untouched. */
html,body{height:100%;overflow:hidden!important}
.stage,.page{height:100svh!important;min-height:100svh!important;overflow:hidden!important}
.hero{min-height:0!important;padding:8px 0 12px!important;justify-content:flex-start!important}
.card{margin-top:16px!important;padding-top:24px!important;padding-bottom:16px!important}
.meta{margin-top:10px!important;gap:8px!important}
footer{padding-top:8px!important}
@media(max-height:760px){nav{margin-top:12px!important}.hero{padding-top:4px!important}.card{margin-top:12px!important;padding-top:20px!important;padding-bottom:12px!important}.offer{margin-top:14px!important}.form{margin-top:12px!important}.fine{margin-top:8px!important}.meta{margin-top:8px!important;gap:6px!important}}
@media(max-width:480px){.page{padding-left:18px!important;padding-right:18px!important}.hero{padding-top:8px!important}.card{margin-top:12px!important;padding:20px 18px 12px!important}.offer{margin-top:14px!important;padding:12px 14px!important}.form{margin-top:12px!important}.meta{margin-top:8px!important;gap:7px!important}}
`;
    const patched=html.replace('</style>',layoutOnly+'\\n</style>');
    document.open();document.write(patched);document.close();
  })
  .catch(()=>{document.body.textContent='Guidr is loading. Please refresh.'});
</script>
</body>
</html>
